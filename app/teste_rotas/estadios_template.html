<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Estádios do Brasileirão</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Cidade ID</th>
                <th>Cidade</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            {% for estadio in estadios %}
            <tr>
                <td>{{ estadio.est_id }}</td>
                <td>{{ estadio.est_nome }}</td>
                <td>{{ estadio.cidade_cid_id }}</td>
                <td>{{ estadio.cidade_nome }}</td>
                <td>{{ estadio.cidade_uf }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
